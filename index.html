<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-950 via-gray-850 to-slate-700"
  >

    <div
      class="calculator-card w-full max-w-sm mx-4 rounded-3xl shadow-2xl overflow-hidden border border-t border-t-white/10
    border-l border-l-white/10
    border-b border-b-gray-950
    border-r border-r-gray-950 backdrop-blur-md bg-gray-900/90"
    >

      <div
        class="px-6 pt-6 pb-2 flex items-center justify-between"
      >
        <span class="text font-semibold tracking-widest text-indigo-400 uppercase">Calculator</span>
        <span id="mode-indicator" class="text-xs text-gray-500">Basic Operations</span>
      </div>

      <div class="px-5 pb-4 pt-1">
        <div
          class="display-panel rounded-2xl bg-gray-950/80 border border-white/5 px-5 py-4 flex flex-col items-end min-h-[96px] justify-between shadow-inner"
        >
          <div
            id="expression"
            class="text-gray-500 text-sm font-mono tracking-wide min-h-[20px] text-right w-full truncate"
          >
            &nbsp;
          </div>

          <div
            id="display"
            class="text-white font-mono font-light text-right w-full leading-none mt-1 transition-all duration-150"
            style="font-size: clamp(1.8rem, 8vw, 2.8rem);"
          >
            0
          </div>
        </div>
      </div>

      <div class="px-5 pb-6 grid grid-cols-4 gap-3">

        <button data-action="clear"
          class="btn btn-utility col-span-1">C</button>

        <button data-action="sign"
          class="btn btn-utility col-span-1">+/−</button>

        <button data-action="percent"
          class="btn btn-utility col-span-1">%</button>

        <button data-operator="÷"
          class="btn btn-operator col-span-1">÷</button>

        <button data-digit="7" class="btn btn-digit">7</button>
        <button data-digit="8" class="btn btn-digit">8</button>
        <button data-digit="9" class="btn btn-digit">9</button>
        <button data-operator="×"
          class="btn btn-operator">×</button>

        <button data-digit="4" class="btn btn-digit">4</button>
        <button data-digit="5" class="btn btn-digit">5</button>
        <button data-digit="6" class="btn btn-digit">6</button>
        <button data-operator="−"
          class="btn btn-operator">−</button>

        <button data-digit="1" class="btn btn-digit">1</button>
        <button data-digit="2" class="btn btn-digit">2</button>
        <button data-digit="3" class="btn btn-digit">3</button>
        <button data-operator="+"
          class="btn btn-operator">+</button>

        <button data-digit="0"
          class="btn btn-digit col-span-2 justify-start pl-7">0</button>

        <button data-action="decimal"
          class="btn btn-digit">.</button>

        <button data-action="equals"
          class="btn btn-equals">=</button>

        <button data-action="backspace"
          class="btn btn-backspace col-span-4">
          ⌫ &nbsp;Delete
        </button>
      </div>
      
      <div class="text-center text-xs text-gray-600 pb-4 tracking-wide">
        ⌨ Keyboard supported &nbsp;|&nbsp; Esc = Clear &nbsp;|&nbsp; Enter = Equals
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
